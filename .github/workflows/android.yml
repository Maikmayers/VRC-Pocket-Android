name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -q VRC-Pocket-Android-Alpha-0.1.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build APK
        working-directory: vrc-pocket
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VRC-Pocket-Android-APK
          path: vrc-pocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
